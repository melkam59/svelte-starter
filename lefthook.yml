# Git hooks: https://lefthook.dev. Installed by `pnpm install`. Skip once with `LEFTHOOK=0 git commit ...`.
pre-commit:
  piped: true # format first, then lint the formatted files
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --redact --staged --verbose
    - name: format
      glob: '*.{js,ts,svelte,css,json,md,yml,yaml,html}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - run: pnpm check
    - run: pnpm lint
